services:
  kural:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    environment:
      DB_PATH: /srv/data/kural.db
      TTS_CACHE_DIR: /srv/data/tts_cache
    volumes:
      - kural-data:/srv/data
      - ./kb:/srv/kb
    restart: unless-stopped

  # Optional: self-host Evon v3.3 on an NVIDIA GPU box (needs ~48 GB+ VRAM in bf16).
  # Start with:  docker compose --profile gpu up
  # then set EVON_BASE_URL=http://evon:8000/v1 in .env
  evon:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    command: >
      --model gnani/gnani-evon-v3.3-30B-A3B --trust-remote-code
      --max-model-len 32768 --served-model-name gnani/gnani-evon-v3.3-30B-A3B
      --reasoning-parser nano_v3
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

volumes:
  kural-data:
  hf-cache:
